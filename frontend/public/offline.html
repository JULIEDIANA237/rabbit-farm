<!doctype html>
<html lang="fr">
  <head>

    <title>Hors ligne · Rabbit Farm</title>
    <style>

  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />

      <button onclick="location.reload()">Réessayer</button>
    </div>
