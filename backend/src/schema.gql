type Mutation {
  """Enregistrer à la main un abonnement payé hors de l’app"""
  activateSubscription(farmId: ID!, plan: SubscriptionPlan!): Boolean!
  addFarmMember(input: AddMemberInput!): FarmMembershipModel!
  addLotMembers(input: AddLotMembersInput!): [LotMembershipModel!]!
  addPayment(input: CreatePaymentInput!): PaymentModel!
  addRabbitIdentification(input: AddRabbitIdentificationInput!, rabbitId: ID!): RabbitIdentificationModel!

  """Répond à une question en un geste."""
  answerCompanionQuestion(id: ID!, value: String!): CompanionQuestionModel!

  """
  Déduit du stock les rations des jours écoulés depuis la dernière déduction.
  """
  applyFeedRations(inventoryItemId: ID!): StockMovementModel

  """Valide une proposition (avec le brouillon modifié, si fourni)."""
  approveAgentSuggestion(draft: String, id: ID!): AgentSuggestionModel!

  """Question libre sur la plateforme."""
  askAgent(input: AskAgentInput!): String!

  """Pose une question à l’assistant (aucune donnée n’est modifiée)"""
  askAssistant(input: AskAssistantInput!): AssistantReplyModel!

  """La femelle est-elle prête pour une nouvelle saillie ?"""
  assessRemating(input: AssessRematingInput!): RematingAssessmentModel!
  assignLitterRabbitsToCage(input: AssignLitterRabbitsToCageInput!): [RabbitCageMovementModel!]!
  cancelBreeding(input: CancelBreedingInput!): BreedingModel!

  """Annule une sortie (décès, réforme, transfert) saisie par erreur."""
  cancelRabbitExit(rabbitId: ID!): RabbitModel!
  cancelSale(input: CancelSaleInput!): SaleModel!

  """Vérifier un paiement en ligne au retour de NotchPay"""
  checkSubscriptionPayment(reference: String!): SubscriptionPaymentModel!

  """L’assistant fait le tour de la ferme maintenant (sans notification)."""
  companionTourNow: [CompanionQuestionModel!]!
  completeFatteningLot(input: CompleteFatteningLotInput!): FatteningLotModel!
  completeWeaning(input: CompleteWeaningInput!): WeaningModel!
  confirmSubscriptionPayment(id: ID!): SubscriptionPaymentModel!
  createAdoption(input: CreateAdoptionInput!): AdoptionModel!
  createBirth(input: CreateBirthInput!): BirthModel!
  createBreed(input: CreateBreedInput!): BreedModel!
  createBreeding(input: CreateBreedingInput!): BreedingModel!
  createCage(input: CreateCageInput!): CageModel!
  createCareRecord(input: CreateCareRecordInput!): CareRecordModel!
  createCrossBreed(input: CreateCrossBreedInput!): CrossBreedModel!
  createCustomer(input: CreateCustomerInput!): CustomerModel!
  createExpense(input: CreateExpenseInput!): ExpenseModel!
  createFarm(input: CreateFarmInput!): FarmModel!
  createFatteningLot(input: CreateFatteningLotInput!): FatteningLotModel!
  createHealthRecord(input: CreateHealthRecordInput!): HealthRecordModel!
  createInventoryItem(input: CreateInventoryItemInput!): InventoryItemModel!
  createLitter(input: CreateLitterInput!): LitterModel!
  createLitterRabbits(input: CreateLitterRabbitsInput!): [RabbitModel!]!
  createPregnancyCheck(input: CreatePregnancyCheckInput!): PregnancyModel!
  createRabbit(input: CreateRabbitInput!): RabbitModel!
  createSale(input: CreateSaleInput!): SaleModel!
  createSection(input: CreateSectionInput!): SectionModel!
  createStockMovement(input: CreateStockMovementInput!): StockMovementModel!
  createTask(input: CreateTaskInput!): TaskModel!
  createWeaning(input: CreateWeaningInput!): WeaningModel!
  createWeighing(input: CreateWeighingInput!): WeighingModel!

  """
  Déclarer un paiement Mobile Money, confirmé ensuite par la propriétaire
  """
  declareSubscriptionPayment(plan: SubscriptionPlan!, reference: String): SubscriptionPaymentModel!
  deleteBirth(id: ID!): Boolean!
  deleteBreed(id: ID!): Boolean!
  deleteBreeding(id: ID!): Boolean!
  deleteCage(id: ID!): CageModel!
  deleteCareRecord(id: ID!): Boolean!
  deleteCrossBreed(id: ID!): Boolean!
  deleteCustomer(id: ID!): Boolean!
  deleteExpense(id: ID!): Boolean!
  deleteFatteningLot(id: ID!): Boolean!
  deleteHealthRecord(id: ID!): Boolean!
  deleteInventoryItem(id: ID!): Boolean!
  deleteMortalityRecord(id: ID!): Boolean!
  deletePayment(id: ID!): Boolean!
  deletePregnancyCheck(id: ID!): Boolean!

  """Supprime définitivement un lapin et tout ce qui lui est lié."""
  deleteRabbit(id: ID!): Boolean!

  """
  Supprime un événement de l’historique saisi par erreur (cage, lot, sevrage, adoption)
  """
  deleteRabbitHistoryEvent(rabbitId: ID!, recordId: ID!, type: String!): Boolean!
  deleteSale(id: ID!): Boolean!
  deleteSection(id: ID!): SectionModel!
  deleteStockMovement(id: ID!): Boolean!

