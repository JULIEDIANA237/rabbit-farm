  setContactMessageHandled(handled: Boolean!, id: ID!): ContactMessageModel!

  """Accorder ou retirer l’accès gratuit à vie"""
  setFarmFreeAccess(farmId: ID!, free: Boolean!): Boolean!
  setFeedRations(input: SetFeedRationsInput!): FeedingItemPlanModel!

  """Marque (ou retire) des lapins comme prêts pour la vente"""
  setRabbitsReadyForSale(rabbitIds: [ID!]!, ready: Boolean!): Int!

  """
  Payer par Mobile Money : demande envoyée sur le téléphone, ou page NotchPay en secours
  """
  startSubscriptionCheckout(operator: MobileOperator, phone: String, plan: SubscriptionPlan!): SubscriptionCheckoutModel!

  """Abonne cet appareil aux rappels du jour."""
  subscribePush(input: PushSubscriptionInput!): Boolean!

  """Désabonne cet appareil."""
  unsubscribePush(endpoint: String!): Boolean!
  updateBirth(input: UpdateBirthInput!): BirthModel!
  updateBreed(input: UpdateBreedInput!): BreedModel!
  updateBreeding(input: UpdateBreedingInput!): BreedingModel!
  updateCage(input: UpdateCageInput!): CageModel!
