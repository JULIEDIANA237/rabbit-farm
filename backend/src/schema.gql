  deleteSubscriptionPayment(id: ID!): Boolean!
  deleteTask(id: ID!): Boolean!
  deleteWeaning(id: ID!): Boolean!
  deleteWeighing(id: ID!): Boolean!
  dismissAgentSuggestion(id: ID!): AgentSuggestionModel!
  dismissCompanionQuestion(id: ID!): CompanionQuestionModel!

  """Offrir des jours d’essai en plus"""
  extendTrial(days: Int!, farmId: ID!): Boolean!

