  rejectSubscriptionPayment(id: ID!): SubscriptionPaymentModel!
  removeFarmMember(membershipId: ID!): FarmMembershipModel!
  removeLotMembers(input: RemoveLotMembersInput!): [LotMembershipModel!]!

  """Envoie un lien de réinitialisation du mot de passe par e-mail."""
  requestPasswordReset(input: RequestPasswordResetInput!): Boolean!
  resetFarmData(confirmation: String!): [FarmResetCountModel!]!

  """Choisit un nouveau mot de passe à partir du lien reçu."""
  resetPassword(input: ResetPasswordInput!): Boolean!

  """Zone contact de la page d’accueil (sans compte)."""
